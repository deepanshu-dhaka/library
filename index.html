<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Library: <span>A Book Tracker</span></h1>
    <div class="card-collection"></div>

    <button id="open-dialog-btn">Add New Book</button>
    <dialog id="my-dialog">
      <form class="form-to-get-new-data">
        <div class="book-name-field">
          <label for="title">Name of the Book:</label>
          <input type="text" name="title" id="title" />
        </div>

        <div class="author-name-field">
          <label for="author">Name of the Author:</label>
          <input type="text" name="author" id="author" />
        </div>
        <div class="pages-and-reading-status">
          <div class="page-field">
            <label for="noOfPages">Number of Pages</label>
            <input type="number" id="noOfPages" name="noOfPages" />
          </div>

          <div class="select-wrapper">
            <label for="readinStatus">Reading Status:</label>
            <select name="readingStatus" id="readingStatus">
              <option value="Currently Reading">Currently Reading</option>
              <option value="Finished">Finished</option>
              <option value="Want to Read">Want to Read</option>
              <option value="On Hold">On Hold</option>
              <option value="Dropped">Dropped</option>
            </select>
          </div>
        </div>
        <div class="submit-and-close-btn">
          <button id="submit-form-btn" formmethod="dialog">Submit</button>
          <button type="button" id="close-dialog-btn">Close</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
